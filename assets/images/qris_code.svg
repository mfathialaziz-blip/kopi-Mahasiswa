<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#ffffff" rx="8" />
  <!-- QR Corner 1 -->
  <rect x="20" y="20" width="50" height="50" fill="#2E190E" rx="4" />
  <rect x="28" y="28" width="34" height="34" fill="#ffffff" rx="2" />
  <rect x="36" y="36" width="18" height="18" fill="#C67C4E" rx="2" />

  <!-- QR Corner 2 -->
  <rect x="130" y="20" width="50" height="50" fill="#2E190E" rx="4" />
  <rect x="138" y="28" width="34" height="34" fill="#ffffff" rx="2" />
  <rect x="146" y="36" width="18" height="18" fill="#C67C4E" rx="2" />

  <!-- QR Corner 3 -->
  <rect x="20" y="130" width="50" height="50" fill="#2E190E" rx="4" />
  <rect x="28" y="138" width="34" height="34" fill="#ffffff" rx="2" />
  <rect x="36" y="146" width="18" height="18" fill="#C67C4E" rx="2" />

  <!-- Data Matrix Dots -->
  <rect x="80" y="24" width="12" height="12" fill="#2E190E" rx="2" />
  <rect x="100" y="24" width="12" height="12" fill="#2E190E" rx="2" />
  <rect x="80" y="44" width="12" height="12" fill="#2E190E" rx="2" />
