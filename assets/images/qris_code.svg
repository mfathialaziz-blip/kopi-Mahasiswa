  <rect x="24" y="100" width="24" height="12" fill="#C67C4E" rx="2" />

  <!-- Center Coffee Bean Mascot in QR -->
  <rect x="80" y="80" width="40" height="40" fill="#2E190E" rx="8" />
  <circle cx="100" cy="100" r="14" fill="#FFCF55" />
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2E190E" text-anchor="middle">☕</text>

  <!-- Bottom Right Matrix Dots -->
  <rect x="80" y="130" width="12" height="24" fill="#2E190E" rx="2" />
  <rect x="100" y="130" width="18" height="12" fill="#C67C4E" rx="2" />
  <rect x="100" y="150" width="12" height="24" fill="#2E190E" rx="2" />
  <rect x="130" y="80" width="24" height="12" fill="#2E190E" rx="2" />
  <rect x="160" y="80" width="14" height="12" fill="#C67C4E" rx="2" />
  <rect x="130" y="100" width="12" height="24" fill="#C67C4E" rx="2" />
  <rect x="150" y="100" width="24" height="12" fill="#2E190E" rx="2" />
  <rect x="130" y="130" width="12" height="12" fill="#2E190E" rx="2" />
  <rect x="150" y="130" width="24" height="12" fill="#C67C4E" rx="2" />
  <rect x="130" y="150" width="34" height="12" fill="#2E190E" rx="2" />
  <rect x="170" y="150" width="12" height="24" fill="#C67C4E" rx="2" />
